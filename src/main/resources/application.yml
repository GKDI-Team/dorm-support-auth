spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:identity_db}
    username: ${DB_USER:dormsupport}
    password: ${DB_PASSWORD:dormsupport}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-please-32-bytes}
    ttl: ${JWT_TTL:24h}
  seed:
    enabled: ${AUTH_SEED_ENABLED:true}
