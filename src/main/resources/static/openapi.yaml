openapi: 3.0.3
info:
  title: DormSupport Identity API
  version: 0.1.0
  description: Registration, login and current-user operations for the MVP.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
paths:
  /health:
    get:
      tags: [Auth]
      summary: Service health
      responses:
        '200':
          description: Service is available
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Resident registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Login already exists
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with login and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      security:
        - SessionId: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
      name: X-Session-Id
  schemas:
    RegisterRequest:
      type: object
      required: [login, password, fullName, blockId, roomNumber]
      properties:
        login: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        blockId: { type: integer, format: int64, minimum: 1 }
        roomNumber: { type: string, maxLength: 20 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [sessionId, user]
      properties:
        sessionId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, login, fullName, role]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [RESIDENT, ADMIN] }
        blockId: { type: integer, format: int64, nullable: true }
        roomNumber: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
