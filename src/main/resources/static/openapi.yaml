openapi: 3.0.3
info:
  title: DormSupport Identity API
  version: 0.1.0
  description: Admin-managed user accounts, login and current-user operations for the MVP.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
paths:
  /health:
    get:
      tags: [Auth]
      summary: Service health
      responses:
        '200':
          description: Service is available
  /api/v1/admin/users:
    post:
      tags: [Auth]
      summary: Create a user account
      security:
        - SessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Administrator role required
        '409':
          description: Login already exists
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with login and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      security:
        - SessionId: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security:
        - SessionId: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/v1/sessions/{sessionId}:
    get:
      tags: [Internal]
      summary: Validate a session for internal services
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active session information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
      name: X-Session-Id
  schemas:
    CreateUserRequest:
      type: object
      required: [login, password, fullName, role, blockId, roomNumber]
      properties:
        login: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        role: { type: string, enum: [RESIDENT, REVIEWER] }
        blockId: { type: string, format: uuid }
        roomNumber: { type: string, maxLength: 20 }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [sessionId, user]
      properties:
        sessionId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
    SessionInfo:
      type: object
      required: [sessionId, expiresAt, user]
      properties:
        sessionId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, login, fullName, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [RESIDENT, REVIEWER, ADMIN] }
        blockId: { type: string, format: uuid, nullable: true }
        roomNumber: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid credentials or missing, expired or revoked session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
